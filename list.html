<p id="statusMessage" style="text-align:center;color:#888;padding:40px 0;"></p>

<script>
const OWNER = "Sakakuri";
const REPO = "rittaiya";
const COLS = 4;  // 列数
const ROWS = 8;  // 最初に用意しておく行数

let allCards = []; // { title, description, element(td) } を保持して検索に使う
let cellIndex = 0;

function setStatus(msg){
    document.getElementById("statusMessage").textContent = msg;
}

// 最初に4列×8行(=32マス)の空テーブルを組んでおく
function buildEmptyTable(){
    const body = document.getElementById("fbxTableBody");
    for(let r=0; r<ROWS; r++){
        const tr = document.createElement("tr");
        for(let c=0; c<COLS; c++){
            const td = document.createElement("td");
            td.id = "cell-" + (r*COLS + c);
            tr.appendChild(td);
        }
        body.appendChild(tr);
    }
}

// 32マスを使い切ったら行を追加していく（作品数がそれ以上ある場合の保険）
function nextCell(){
    let td = document.getElementById("cell-" + cellIndex);
    if(!td){
        const body = document.getElementById("fbxTableBody");
        // 新しい行が必要なら1行分（4マス）まとめて追加
        if(cellIndex % COLS === 0){
            const tr = document.createElement("tr");
            body.appendChild(tr);
        }
        const rows = body.querySelectorAll("tr");
        const lastRow = rows[rows.length-1];
        td = document.createElement("td");
        td.id = "cell-" + cellIndex;
        lastRow.appendChild(td);
    }
    cellIndex++;
    return td;
}

async function load(){
    buildEmptyTable();
    setStatus("読み込み中...");

    let releases;
    try{
        const res = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/releases?per_page=100`
        );
        if(!res.ok){
            throw new Error(`GitHub API error: ${res.status}`);
        }
        releases = await res.json();
    }catch(e){
        setStatus("読み込みに失敗しました。しばらくしてから再度お試しください。");
        console.error(e);
        return;
    }

    if(!Array.isArray(releases) || releases.length === 0){
        setStatus("まだ作品が登録されていません。");
        return;
    }

    for(const release of releases){

        const fbxFiles = release.assets.filter(a =>
            a.name.toLowerCase().endsWith(".fbx")
        );

        for(const fbx of fbxFiles){

            const base = fbx.name.replace(/\.fbx$/i,"");

            const png = release.assets.find(a =>
                a.name.toLowerCase() === base.toLowerCase()+"_1.png"
            );

            // "{base}_{連番}_{Base64チャンク}" という名前のファイル群を探して連番順に結合する
            const infoChunks = release.assets
                .filter(a => a.name.toLowerCase().startsWith(base.toLowerCase() + "_") && !/\.(fbx|png|jpe?g)$/i.test(a.name))
                .map(a => {
                    const rest = a.name.slice(base.length + 1); // "{連番}_{チャンク}"
                    const sep = rest.indexOf("_");
                    if(sep === -1) return null;
                    const idx = parseInt(rest.slice(0, sep), 10);
                    const chunk = rest.slice(sep + 1);
                    if(isNaN(idx)) return null;
                    return { idx, chunk };
                })
                .filter(x => x !== null)
                .sort((a, b) => a.idx - b.idx);

            let title = base;
            let description = "";
            let keywords = [];

            // ファイル名向けに変換したBase64 → 元のUTF-8文字列に戻す
            function fromSafeBase64(s){
                let b64 = s.replace(/\./g, "+").replace(/-/g, "/");
                while(b64.length % 4) b64 += "=";
                const binary = atob(b64);
                const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
                return new TextDecoder().decode(bytes);
            }

            if(infoChunks.length > 0){
                try{
                    const encoded = infoChunks.map(c => c.chunk).join("");
                    const combined = fromSafeBase64(encoded);
                    // 1行目=タイトル, 2行目=キーワード(カンマ区切り), 3行目以降=説明文
                    const lines = combined.replace(/\r/g,"").split("\n");

                    if(lines.length>0 && lines[0].trim()!==""){
                        title = lines[0];
                    }
                    if(lines.length>1 && lines[1].trim()!==""){
                        keywords = lines[1].split(",")
                            .map(k => k.trim())
                            .filter(k => k !== "");
                    }
                    description = lines.slice(2).join("\n");
                }catch(e){
                    console.warn("情報ファイルのデコードに失敗:", base, e);
                }
            }

            const td = nextCell();
            td.className = "cardCell";

            const card = document.createElement("a");
            card.className = "card";
            card.href = fbx.browser_download_url;

            const img = document.createElement("img");
            img.src = png ? png.browser_download_url : "placeholder.png";
            img.alt = title;

            const body = document.createElement("div");
            body.className = "card-body";

            const titleEl = document.createElement("div");
            titleEl.className = "card-title";
            titleEl.textContent = title;

            const descEl = document.createElement("div");
            descEl.className = "card-description";
            descEl.textContent = description;

            body.appendChild(titleEl);
            body.appendChild(descEl);
            card.appendChild(img);
            card.appendChild(body);

            td.appendChild(card);

            allCards.push({ title, description, keywords, element: td });
        }
    }

    if(allCards.length === 0){
        setStatus("公開されているFBXファイルが見つかりませんでした。");
    }else{
        setStatus("");
    }
}

function applySearch(){
    const query = document.getElementById("searchInput").value.trim().toLowerCase();
    let visibleCount = 0;

    for(const c of allCards){
        const match = !query
            || c.title.toLowerCase().includes(query)
            || c.description.toLowerCase().includes(query)
            || c.keywords.some(k => k.toLowerCase().includes(query));
        c.element.style.display = match ? "" : "none";
        if(match) visibleCount++;
    }

    if(allCards.length > 0){
        setStatus(visibleCount === 0 ? "該当する作品が見つかりませんでした。" : "");
    }
}

document.getElementById("searchButton").addEventListener("click", applySearch);
document.getElementById("searchInput").addEventListener("keydown", (e) => {
    if(e.key === "Enter"){
        e.preventDefault();
        applySearch();
    }
});

load();
</script>
